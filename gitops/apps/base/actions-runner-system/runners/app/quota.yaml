---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: runner-quota
  namespace: arc-runners
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "14"
    limits.memory: 24Gi
    pods: "24"
    persistentvolumeclaims: "8"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: runner-limits
  namespace: arc-runners
spec:
  limits:
    - type: Container
      default: {cpu: "2", memory: 4Gi}
      defaultRequest: {cpu: 250m, memory: 512Mi}
      max: {cpu: "4", memory: 8Gi}
      min: {cpu: 10m, memory: 32Mi}
