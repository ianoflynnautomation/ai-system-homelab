---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-egress
  namespace: arc-runners
spec:
  podSelector: {}
  policyTypes: [Egress, Ingress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}

    - to:
        - ipBlock: {cidr: 10.43.0.1/32}
      ports:
        - {protocol: TCP, port: 6443}
        - {protocol: TCP, port: 443}

    - to:
        - ipBlock: {cidr: 192.168.1.10/32}
      ports:
        - {protocol: TCP, port: 6443}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8         # RFC1918, and the default k8s pod CIDR
              - 172.16.0.0/12      # RFC1918, and Docker's default range
              - 192.168.0.0/16     # RFC1918, typical home LAN
              - 169.254.0.0/16     # link-local, incl. 169.254.169.254
              - 127.0.0.0/8        # loopback
              - 100.64.0.0/10      # CGNAT, used by Tailscale
