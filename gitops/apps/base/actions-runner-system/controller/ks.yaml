---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actions-runner-controller
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./gitops/apps/base/actions-runner-system/controller/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
