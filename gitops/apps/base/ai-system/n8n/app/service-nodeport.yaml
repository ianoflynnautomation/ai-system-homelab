---
apiVersion: v1
kind: Service
metadata:
  name: n8n-nodeport
  namespace: ai-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/component: main
  ports:
    - name: http
      protocol: TCP
      port: 5678
      targetPort: http
      nodePort: 30678
