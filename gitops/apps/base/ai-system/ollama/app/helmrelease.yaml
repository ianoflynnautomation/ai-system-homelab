---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
  namespace: ai-system
spec:
  interval: 1h
  chart:
    spec:
      chart: ollama
      version: 1.84.0
      sourceRef:
        kind: HelmRepository
        name: otwld
        namespace: ai-system
      interval: 30m
  install:
    timeout: 30m
    remediation:
      retries: 3
  upgrade:
    timeout: 30m
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  driftDetection:
    mode: enabled
  maxHistory: 3

  values:
    replicaCount: 1
    ollama:
      gpu:
        enabled: false
      models:
        pull:
          - qwen2.5:3b
    extraEnv:
      - name: OLLAMA_NUM_PARALLEL
        value: "1"
      - name: OLLAMA_MAX_LOADED_MODELS
        value: "1"
      - name: OLLAMA_KEEP_ALIVE
        value: "30m"
    persistentVolume:
      enabled: true
      storageClass: local-path
      size: 20Gi
    service:
      type: ClusterIP
      port: 11434
    resources:
      requests: {cpu: "2", memory: 4Gi}
      limits: {cpu: "16", memory: 4Gi}
