---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama
  namespace: ai-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ollama
      app.kubernetes.io/instance: ollama
  policyTypes: [Egress, Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: open-webui
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: n8n
      ports:
        - {protocol: TCP, port: 11434}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8         # RFC1918, and the default k8s pod CIDR
              - 172.16.0.0/12      # RFC1918, and Docker's default range
              - 192.168.0.0/16     # RFC1918, typical home LAN
              - 169.254.0.0/16     # link-local, incl. 169.254.169.254
              - 127.0.0.0/8        # loopback
              - 100.64.0.0/10      # CGNAT, used by Tailscale
      ports:
        - {protocol: TCP, port: 443}
