---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ollama
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 20m
  path: ./gitops/apps/base/ai-system/ollama/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
