---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-system-quota
  namespace: ai-system
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 8Gi
    limits.cpu: "24"
    limits.memory: 18Gi
    pods: "14"
    persistentvolumeclaims: "6"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ai-system-limits
  namespace: ai-system
spec:
  limits:
    - type: Container
      default: {cpu: "1", memory: 1Gi}
      defaultRequest: {cpu: 50m, memory: 128Mi}
      max: {cpu: "16", memory: 8Gi}
      min: {cpu: 10m, memory: 32Mi}
