---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

resources:
  - grafana.yaml
  - grafanadatasource.yaml
  - grafanadashboards.yaml

configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/arc-autoscaling.json
      - dashboards/arc-jobs.json
      - dashboards/flux-cluster.json
      - dashboards/flux-control-plane.json

generatorOptions:
  disableNameSuffixHash: true
