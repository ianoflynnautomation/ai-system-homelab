---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: actions-runner-controller
  namespace: observability
  labels:
    app.kubernetes.io/part-of: github-runner-k8s
spec:
  namespaceSelector:
    matchNames:
      - arc-systems
  selector:
    matchLabels:
      app.kubernetes.io/part-of: gha-rs-controller
      app.kubernetes.io/component: controller-manager
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 1m
      scrapeTimeout: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: actions-runner-listener
  namespace: observability
  labels:
    app.kubernetes.io/part-of: github-runner-k8s
spec:
  namespaceSelector:
    matchNames:
      - arc-systems
  selector:
    matchLabels:
      app.kubernetes.io/component: runner-scale-set-listener
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 1m
      scrapeTimeout: 30s
